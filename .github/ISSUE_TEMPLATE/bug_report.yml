name: Bug report
description: Something produces a wrong result or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened"
      description: "What you expected vs. what you got"
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: "Steps / requirement text"
      description: "The exact requirement text or command; attach the generated script or STEP if relevant"
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: "Version / commit"
      placeholder: "v0.1.0 or git sha"
  - type: dropdown
    id: where
    attributes:
      label: Area
      options: [agent loop, checks / DFM, drawing, render, web app, UI, feishu adapter, eval, docs, other]
  - type: textarea
    id: logs
    attributes:
      label: "Logs"
      description: "Do not paste API keys or tokens."
      render: shell
