name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GHCR paths use the owner name, and Docker references cannot have a path component ending in "-"
      # (e.g. an owner named "name-"). For such owners the image is built but not pushed.
      - id: target
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if echo "$owner" | grep -Eq '^[a-z0-9]+([._-][a-z0-9]+)*$'; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Owner '$owner' is not a valid Docker namespace; building the web image without pushing to GHCR."
          fi
          echo "image=ghcr.io/${owner}/${GITHUB_REPOSITORY#*/}-web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - if: steps.target.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: steps.target.outputs.push == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.target.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          # amd64 + arm64 (all locked dependencies ship aarch64 wheels since cadquery 2.8 / cadquery-ocp 7.9.3;
          # tests.yml builds and smoke-tests both natively). Override with repo variable WEB_PLATFORMS.
          platforms: ${{ vars.WEB_PLATFORMS || 'linux/amd64,linux/arm64' }}
          push: ${{ steps.target.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags || 'lingenious-web:release' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: web-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Release notes = the CHANGELOG section of this version ("## [x.y.z] - date" up to the next heading or link definitions).
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag $flags
