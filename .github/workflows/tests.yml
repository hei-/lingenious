name: tests
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dev image
        run: docker build --target dev -t lingenious:ci .
      - name: pytest (fast, not slow)
        run: docker run --rm lingenious:ci pytest -m "not slow"
      - name: pytest (full) with coverage
        run: |
          docker run --name cov lingenious:ci pytest --cov --cov-report=term --cov-report=xml
      - name: Copy coverage.xml
        if: always()
        run: docker cp cov:/app/coverage.xml coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
      - name: ruff check
        run: docker run --rm lingenious:ci ruff check .
      - name: mypy
        run: docker run --rm lingenious:ci mypy

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  docker-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          load: true
          tags: lingenious-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name web -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp:size=512m,exec lingenious-web:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/api/examples | head -c 300
      - name: Container logs
        if: failure()
        run: docker logs web

  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check JS
        run: for f in web/landing/js/*.js; do node --check "$f"; done
      - name: Validate JSON data files
        run: |
          python3 - <<'PY'
          import glob, json
          for f in glob.glob("web/landing/data/*.json"):
              json.load(open(f))
              print("ok", f)
          PY
